[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "possibilities"
version = "0.2.0"
description = "AI-powered possibility tree explorer -- find the ideas that open the most doors"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.0",
]

[project.scripts]
possibilities = "possibilities.cli:main"

[tool.setuptools.packages.find]
include = ["possibilities*"]
